<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} - {{ .Site.Title }}</title>

    <!-- Pico CSS: liefert Typographie, Abstände Tabellen und Nav-Styling automatisch für reine HTML-Inhalte 
     ganz ohne class-Attribute-->

    <link rel="stylesheet" href="{{ "css/pico.classless.css" | relURL }}">
</head>
<body>
    <header>
        <nav>
            <!-- Navigation erste ul aus Konformitätsgründen mit pico CSS -->
            <!--    
            <ul>
                <li><strong>{{ .Site.Title }}</strong></li>
            </ul>
            --> 
            <ul>
                    <!-- 
                    Filtert das Menü auf '.Kind "page"': 
                    Zeigt nur die 3 Preislisten-Dateien an.
                    Blendet Startseite (_index.md), Kategorien und Tags automatisch aus.
                    Sortierung erfolgt über 'weight: 10' im Front Matter der .md-Dateien.
                    -->
                {{ range .Site.Pages.ByWeight }}
                    {{ if eq .Kind "page" }}
                    <li><a href="{{ .RelPermalink }}" {{ if eq . $.Page }}aria-current="page"{{ end }}>{{ .Title }}</a></li>
                    {{ end }}
                {{ end }}
            </ul>
        </nav>
    </header>
    <main>
        {{ block "main" . }}{{ end }}
    </main>
</body>
</html>
